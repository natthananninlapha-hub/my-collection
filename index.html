<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Collection</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAFAF8;--card:#fff;--ink:#1a1c1b;--mut:#6b6878;--line:#EFEFED;--pri:#7C6CF0;--sec:#EDE9FE;--red:#E5484D;--redbg:#FDECEC;--ph:#eeeeec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121214;--card:#18181B;--ink:#f1f1ef;--mut:#a09db0;--line:rgba(255,255,255,.08);--sec:#2b2658;--redbg:#3a1d20;--ph:#26262b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121214;--card:#18181B;--ink:#f1f1ef;--mut:#a09db0;--line:rgba(255,255,255,.08);--sec:#2b2658;--redbg:#3a1d20;--ph:#26262b;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 "Plus Jakarta Sans","Noto Sans Thai",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:8px;height:60px;padding:0 12px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px)}
.top h1{flex:1;margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center}
.ib:active{background:var(--sec)}
.wrap{max-width:1200px;margin:0 auto;padding:4px 16px 110px}
.search{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--mut)}
.search:focus-within{border-color:var(--pri);box-shadow:0 0 0 3px rgba(124,108,240,.15)}
.search input{flex:1;border:0;outline:0;background:none;color:var(--ink);min-width:0}
.chips{display:flex;gap:10px;overflow-x:auto;padding:14px 0;scrollbar-width:none}
.chip{flex:none;height:38px;padding:0 16px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:13px;color:var(--mut)}
.chip.on{background:var(--sec);border-color:rgba(124,108,240,.4);color:var(--pri)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);gap:20px}}
@media(min-width:1024px){.grid{grid-template-columns:repeat(5,1fr);gap:28px}}
.cd{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:10px;box-shadow:0 4px 16px rgba(0,0,0,.03);transition:.25s}
.cd:hover{box-shadow:0 12px 32px rgba(124,108,240,.12);transform:translateY(-2px)}
.im{aspect-ratio:4/5;border-radius:16px;background:var(--ph) center/cover;display:grid;place-items:center;color:var(--mut)}
.cd h3{margin:10px 4px 8px;font-size:15px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:40px}
.cd .tag{display:inline-block;margin:0 4px 8px;font-size:11px;font-weight:600;color:var(--pri);background:var(--sec);padding:2px 9px;border-radius:99px}
.row{display:flex;align-items:center;justify-content:space-between;padding:0 2px}
.open{background:var(--sec);color:var(--pri);font-weight:600;font-size:13px;padding:7px 16px;border-radius:12px}
.fab{position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;box-shadow:0 16px 40px rgba(124,108,240,.4);z-index:30}
.fab svg{width:28px;height:28px}
.empty{text-align:center;color:var(--mut);padding:70px 20px}.empty b{display:block;color:var(--ink);font-size:20px;margin-bottom:6px}
.ov{position:fixed;inset:0;z-index:50;background:rgba(24,24,27,.4);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;animation:f .2s}
@media(min-width:640px){.ov{align-items:center}}
.sh{width:100%;max-width:480px;max-height:92dvh;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 22px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:0 16px 40px rgba(124,108,240,.16);animation:u .3s cubic-bezier(.2,.8,.2,1)}
@media(min-width:640px){.sh{border-radius:28px}}
.sh.c{text-align:center;padding-top:30px}
.hd{width:38px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 14px;filter:brightness(.9)}
.sh h2{margin:0 0 2px;font-size:22px;font-weight:700;letter-spacing:-.015em}.sub{color:var(--mut);font-size:13px;margin:0 0 16px}
label{display:block;font-weight:600;font-size:13px;margin:16px 0 6px}
.in{width:100%;height:48px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);outline:0}
.in:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(124,108,240,.15)}
.btn{width:100%;height:50px;border-radius:14px;font-weight:700;margin-top:12px}
.p{background:var(--pri);color:#fff;box-shadow:0 8px 24px rgba(124,108,240,.3)}.g{background:var(--card);border:1px solid var(--line)}
.up{aspect-ratio:4/5;width:62%;margin:0 auto;border:2px dashed var(--line);border-radius:18px;background:var(--card) center/cover;display:grid;place-items:center;text-align:center;color:var(--mut);font-size:13px;cursor:pointer}
.hint{font-size:12px;color:var(--mut);text-align:center;margin-top:6px}
.err{color:var(--red);font-size:12px;margin-top:6px;min-height:16px}
.lg{display:flex;align-items:center;justify-content:center;gap:12px}
.logo{width:72px;height:72px;border-radius:22px;background:var(--sec);color:var(--pri);display:grid;place-items:center;margin:0 auto 16px}
.dr{position:fixed;inset:0 auto 0 0;width:min(320px,84vw);z-index:60;background:var(--bg);padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;border-radius:0 28px 28px 0;animation:r .28s}
.pf{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}
.av{width:46px;height:46px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px;margin-bottom:8px}
.nv{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:16px;font-weight:600;text-align:left}.nv.on{background:var(--sec);color:var(--pri)}
.out{margin-top:auto;background:var(--redbg);color:var(--red)}
.cr{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 8px 12px 16px;margin-bottom:10px}
.cr>div{flex:1;min-width:0}.cr small{color:var(--mut)}
.dng{color:var(--red)}
.mn{display:flex;align-items:center;gap:12px;width:100%;padding:15px;border-radius:14px;font-weight:600;background:var(--card);border:1px solid var(--line);margin-top:8px}
@keyframes f{from{opacity:0}}@keyframes u{from{transform:translateY(40px);opacity:0}}@keyframes r{from{transform:translateX(-30px);opacity:0}}
</style>
</head>
<body>
<div id="app"></div>
<script>
var I={menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',plus:'<path d="M12 5v14M5 12h14"/>',dots:'<circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',x:'<path d="M6 6l12 12M18 6 6 18"/>',folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',edit:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',img:'<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.5"/><path d="m21 15-5-5L5 21"/>',back:'<path d="M15 18l-6-6 6-6"/>',mark:'<path d="M6 3h12v18l-6-4-6 4z"/>'};
function ic(n,s){return '<svg viewBox="0 0 24 24"'+(s?' style="width:'+s+'px;height:'+s+'px"':'')+'>'+I[n]+'</svg>'}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var S={user:null,cats:[],items:[]};
var V={view:'home',cat:'all',q:'',modal:null,drawer:false,arm:null,draft:null,loading:true};
function save(){}
function uid(){return Math.random().toString(36).slice(2,9)}
function catName(id){var c=S.cats.find(function(c){return c.id===id});return c?c.name:''}
function go(){ // render
  var h='';
  if(V.loading)h='<div class="empty"><b>My Collection</b>Loading…</div>';else if(!S.user)h=login();else if(!S.user.id)h=setup();else h=main();
  document.getElementById('app').innerHTML=h;
}
function login(){return '<div class="ov" style="background:transparent;align-items:center"><div class="sh c" style="border-radius:28px;border:1px solid var(--line);margin:16px"><div class="logo">'+ic('mark',34)+'</div><h2 style="font-size:32px">My Collection</h2><p class="sub">Keep everything you love in one place</p><button class="btn g lg" data-a="google"><svg viewBox="0 0 24 24" style="stroke:none"><path fill="#4285F4" d="M22 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.6a4.8 4.8 0 0 1-2.1 3.1v2.6h3.4c2-1.8 3.1-4.5 3.1-7.5z"/><path fill="#34A853" d="M12 22c2.8 0 5.2-.9 6.9-2.5l-3.4-2.6c-.9.6-2.1 1-3.5 1-2.7 0-5-1.8-5.800-4.300H2.700v2.700A10 10 0 0 0 12 22z"/><path fill="#FBBC05" d="M6.200 13.600a6 6 0 0 1 0-3.800V7.100H2.700a10 10 0 0 0 0 9.200z"/><path fill="#EA4335" d="M12 6c1.500 0 2.900.5 4 1.600l3-3A10 10 0 0 0 2.700 7.100l3.500 2.700C7 7.800 9.300 6 12 6z"/></svg>Sign in with Google</button><p class="hint" style="margin-top:14px">Private &amp; synced across your devices</p></div></div>'}
function setup(){return '<div class="ov" style="background:transparent;align-items:center"><div class="sh c" style="border-radius:28px;border:1px solid var(--line);margin:16px;text-align:left"><h2>Welcome!</h2><p class="sub">Choose a name and a short ID</p><label>Display name</label><input class="in" id="nm" maxlength="30" placeholder="e.g. Nan" value="'+esc(V.nm||'')+'"><label>Short ID</label><input class="in" id="sid" maxlength="20" placeholder="a-z, 0-9, _" autocapitalize="none"><div class="err" id="er"></div><button class="btn p" data-a="start">Get Started</button></div></div>'}
function list(){var q=V.q.trim().toLowerCase();return S.items.filter(function(i){return (V.cat==='all'||i.cat===V.cat)&&(!q||i.title.toLowerCase().indexOf(q)>-1||catName(i.cat).toLowerCase().indexOf(q)>-1)})}
function main(){
  var h='<div class="top"><button class="ib" data-a="drawer">'+ic('menu')+'</button><h1>My Collection</h1></div><div class="wrap">';
  if(V.view==='cols'){
    h+='<h2 style="font-size:26px;margin:8px 0 4px;letter-spacing:-.02em">Collection</h2><p class="sub">'+S.cats.length+' categories</p>';
    S.cats.forEach(function(c){var n=S.items.filter(function(i){return i.cat===c.id}).length;
      h+='<div class="cr"><div data-a="pick" data-id="'+c.id+'" style="cursor:pointer"><b>'+esc(c.name)+'</b><br><small>'+n+' items</small></div><button class="ib" data-a="ren" data-id="'+c.id+'">'+ic('edit',18)+'</button><button class="ib '+(V.arm===c.id?'dng':'')+'" data-a="delc" data-id="'+c.id+'">'+(V.arm===c.id?'<b style="font-size:12px">Sure?</b>':ic('trash',18))+'</button></div>'});
    h+='<button class="btn p" data-a="newc">+ New category</button>';
  }else{
    h+='<div class="search">'+ic('search',20)+'<input id="q" type="search" placeholder="Search titles or categories" value="'+esc(V.q)+'"></div><div class="chips"><button class="chip '+(V.cat==='all'?'on':'')+'" data-a="cat" data-id="all">All '+S.items.length+'</button>';
    S.cats.forEach(function(c){h+='<button class="chip '+(V.cat===c.id?'on':'')+'" data-a="cat" data-id="'+c.id+'">'+esc(c.name)+'</button>'});
    h+='</div>';var L=list();
    if(!L.length)h+='<div class="empty"><b>'+(S.items.length?'Nothing found':'Your collection is empty')+'</b>'+(S.items.length?'Try another search':'Tap + to add your first item')+'</div>';
    else{h+='<div class="grid">';L.forEach(function(i){
      h+='<article class="cd"><div class="im" style="'+(i.img?'background-image:url('+i.img+')':'')+'">'+(i.img?'':ic('img',34))+'</div><h3>'+esc(i.title)+'</h3><span class="tag">'+esc(catName(i.cat))+'</span><div class="row"><button class="open" data-a="open" data-id="'+i.id+'">Open</button><button class="ib" data-a="menu" data-id="'+i.id+'">'+ic('dots')+'</button></div></article>'});h+='</div>'}
    h+='<button class="fab" data-a="add">'+ic('plus')+'</button>';
  }
  h+='</div>';
  if(V.drawer)h+='<div class="ov" data-a="close" style="align-items:stretch;justify-content:flex-start"><div class="dr" data-keep="1"><div class="row"><span class="tag" style="background:var(--sec);color:var(--pri);font-size:11px;font-weight:700;padding:5px 12px;border-radius:99px">MY COLLECTION</span><button class="ib" data-a="close">'+ic('x')+'</button></div><div class="pf"><div class="av">'+esc(S.user.name.charAt(0).toUpperCase())+'</div><b style="font-size:18px">'+esc(S.user.name)+'</b><br><small style="color:var(--mut)">@'+esc(S.user.id)+'</small><br><small style="color:var(--pri);font-weight:600">'+S.items.length+' items · '+S.cats.length+' categories</small></div><button class="nv on" data-a="cols">'+ic('folder')+'Collection</button><button class="nv" data-a="home">'+ic('mark')+'All items</button><button class="nv out" data-a="logout">'+ic('out')+'Log out</button></div></div>';
  if(V.modal)h+=modal();
  return h;
}
function modal(){var m=V.modal,d=V.draft;
  if(m==='item'){var h='<div class="ov" data-a="close"><div class="sh" data-keep="1"><div class="hd"></div><h2>'+(d.id?'Edit item':'Save to Collection')+'</h2><p class="sub">Pick a category, add a title, link and cover</p><label>Category</label><div class="chips" style="padding:0">';
    S.cats.forEach(function(c){h+='<button class="chip '+(d.cat===c.id?'on':'')+'" data-a="dcat" data-id="'+c.id+'">'+esc(c.name)+'</button>'});
    h+='<button class="chip" data-a="newcd">+ New</button></div><label>Title</label><input class="in" id="ti" maxlength="80" placeholder="Title" value="'+esc(d.title)+'"><label>Link (URL)</label><input class="in" id="ur" inputmode="url" autocapitalize="none" placeholder="https://..." value="'+esc(d.url)+'"><label>Cover image (4:5)</label><div class="up" data-a="pickimg" style="'+(d.img?'background-image:url('+d.img+');border-style:solid':'')+'">'+(d.img?'':'<div>'+ic('img',30)+'<br>Tap to choose one image</div>')+'</div><input type="file" id="fi" accept="image/*" hidden><div class="hint">Auto-cropped to 800 × 1000 px</div><div class="err" id="er">'+esc(V.err||'')+'</div><button class="btn p" data-a="done">Done</button><button class="btn g" data-a="close">Cancel</button></div></div>';return h}
  if(m==='cat')return '<div class="ov" data-a="close"><div class="sh" data-keep="1"><div class="hd"></div><h2>'+(d.id?'Rename category':'New category')+'</h2><label>Name</label><input class="in" id="cn" maxlength="30" placeholder="e.g. Coffee Spots" value="'+esc(d.name||'')+'"><div class="err" id="er"></div><button class="btn p" data-a="savec">Save</button><button class="btn g" data-a="close">Cancel</button></div></div>';
  if(m==='menu')return '<div class="ov" data-a="close"><div class="sh" data-keep="1"><div class="hd"></div><button class="mn" data-a="edit">'+ic('edit')+'Edit</button><button class="mn dng" data-a="deli">'+ic('trash')+(V.arm==='i'?'Tap again to delete':'Delete')+'</button><button class="btn g" data-a="close">Cancel</button></div></div>';
  return '';
}
function crop(file,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var W=800,H=1000,c=document.createElement('canvas');c.width=W;c.height=H;var x=c.getContext('2d'),k=Math.max(W/im.width,H/im.height),w=im.width*k,h=im.height*k;x.drawImage(im,(W-w)/2,(H-h)/2,w,h);cb(c.toDataURL('image/jpeg',.7))};im.src=r.result};r.readAsDataURL(file)}
function readDraft(){var t=document.getElementById('ti'),u=document.getElementById('ur');if(t)V.draft.title=t.value;if(u)V.draft.url=u.value}
function fixUrl(u){u=u.trim();if(!u)return '';if(!/^https?:\/\//i.test(u))u='https://'+u;try{var o=new URL(u);return o.hostname.indexOf('.')>0?o.href:''}catch(e){return ''}}
function err(t){var e=document.getElementById('er');if(e)e.textContent=t}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-a]');if(!t)return;
  var a=t.dataset.a,id=t.dataset.id;
  if(t.classList.contains('ov')&&e.target!==t)return; // click on backdrop only
  if(a==='google'){FB.login().catch(function(e){alert('Sign-in failed: '+e.message)})}
  else if(a==='start'){var n=document.getElementById('nm').value.trim(),s=document.getElementById('sid').value.trim().toLowerCase();V.nm=n;
    if(!n)return err('Please enter a name');if(!/^[a-z0-9_]{3,20}$/.test(s))return err('ID: 3-20 chars, a-z 0-9 _');
    S.user.name=n;S.user.id=s;V.view='home';FB.saveProfile(n,s);go()}
  else if(a==='logout'){V.drawer=false;V.view='home';V.nm='';FB.logout()}
  else if(a==='drawer'){V.drawer=true;go()}
  else if(a==='close'){V.drawer=false;V.modal=null;V.arm=null;V.err='';go()}
  else if(a==='cols'){V.view='cols';V.drawer=false;go()}
  else if(a==='home'){V.view='home';V.cat='all';V.drawer=false;go()}
  else if(a==='pick'){V.view='home';V.cat=id;go()}
  else if(a==='cat'){V.cat=id;go()}
  else if(a==='open'){var it=S.items.find(function(i){return i.id===id});if(it)window.open(it.url,'_blank','noopener')}
  else if(a==='menu'){V.modal='menu';V.draft=S.items.find(function(i){return i.id===id});V.arm=null;go()}
  else if(a==='deli'){if(V.arm!=='i'){V.arm='i';go()}else{FB.delItem(V.draft.id);S.items=S.items.filter(function(i){return i.id!==V.draft.id});V.modal=null;V.arm=null;save();go()}}
  else if(a==='edit'){V.draft=Object.assign({},V.draft);V.modal='item';go()}
  else if(a==='add'){if(!S.cats.length){V.draft={};V.modal='cat';V.back=true;go()}else{V.draft={cat:V.cat!=='all'?V.cat:S.cats[0].id,title:'',url:'',img:''};V.modal='item';V.err='';go()}}
  else if(a==='dcat'){readDraft();V.draft.cat=id;go()}
  else if(a==='newcd'){readDraft();V.item=V.draft;V.draft={};V.modal='cat';V.back=true;go()}
  else if(a==='newc'){V.draft={};V.modal='cat';V.back=false;go()}
  else if(a==='ren'){var c=S.cats.find(function(c){return c.id===id});V.draft={id:c.id,name:c.name};V.modal='cat';V.back=false;go()}
  else if(a==='delc'){if(V.arm!==id){V.arm=id;go()}else{S.items.filter(function(i){return i.cat===id}).forEach(function(i){FB.delItem(i.id)});FB.delCat(id);S.cats=S.cats.filter(function(c){return c.id!==id});S.items=S.items.filter(function(i){return i.cat!==id});if(V.cat===id)V.cat='all';V.arm=null;save();go()}}
  else if(a==='savec'){var nm=document.getElementById('cn').value.trim();if(!nm)return err('Please enter a name');
    if(V.draft.id){S.cats.find(function(c){return c.id===V.draft.id}).name=nm;FB.setCat(V.draft.id,nm);V.modal=null}
    else{var c2={id:uid(),name:nm,t:Date.now()};S.cats.push(c2);FB.setCat(c2.id,nm,c2.t);if(V.back){V.draft=V.item||{cat:c2.id,title:'',url:'',img:''};V.draft.cat=c2.id;V.item=null;V.modal='item';V.back=false}else V.modal=null}
    save();go()}
  else if(a==='pickimg'){document.getElementById('fi').click()}
  else if(a==='done'){readDraft();var d=V.draft,u=fixUrl(d.url);
    if(!d.cat)return err('Choose a category');if(!d.title.trim())return err('Please enter a title');if(!u)return err('Please enter a valid link');
    d.url=u;d.title=d.title.trim();
    if(d.id){var o=S.items.find(function(i){return i.id===d.id});Object.assign(o,{cat:d.cat,title:d.title,url:d.url,img:d.img});FB.setItem(o)}
    else{var ni={id:uid(),cat:d.cat,title:d.title,url:d.url,img:d.img||'',t:Date.now()};S.items.unshift(ni);FB.setItem(ni)}
    V.modal=null;V.err='';save();go()}
});
document.addEventListener('change',function(e){if(e.target.id==='fi'&&e.target.files[0]){readDraft();crop(e.target.files[0],function(u){V.draft.img=u;go()})}});
document.addEventListener('input',function(e){if(e.target.id==='q'){V.q=e.target.value;var p=e.target.selectionStart;go();var n=document.getElementById('q');n.focus();n.setSelectionRange(p,p)}});
go();
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,deleteDoc,collection,onSnapshot} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import {firebaseConfig} from "./firebase-config.js";
const auth=getAuth(initializeApp(firebaseConfig)),db=getFirestore();
const R=(...p)=>doc(db,'users',auth.currentUser.uid,...p);
let unsubs=[];
window.FB={
  login:()=>signInWithPopup(auth,new GoogleAuthProvider()),
  logout:()=>signOut(auth),
  saveProfile:(name,id)=>setDoc(doc(db,'users',auth.currentUser.uid),{name,id}),
  setCat:(id,name,t)=>setDoc(R('cats',id),t?{name,t}:{name},{merge:true}),
  delCat:id=>deleteDoc(R('cats',id)),
  setItem:i=>setDoc(R('items',i.id),{cat:i.cat,title:i.title,url:i.url,img:i.img||'',t:i.t||Date.now()}),
  delItem:id=>deleteDoc(R('items',id))
};
const rows=s=>s.docs.map(x=>({id:x.id,...x.data()}));
onAuthStateChanged(auth,async u=>{
  unsubs.forEach(f=>f());unsubs=[];S.cats=[];S.items=[];
  if(!u){S.user=null;V.loading=false;V.view='home';go();return}
  const d=(await getDoc(doc(db,'users',u.uid))).data()||{};
  S.user={uid:u.uid,name:d.name||'',id:d.id||''};V.loading=false;
  unsubs.push(onSnapshot(collection(db,'users',u.uid,'cats'),s=>{S.cats=rows(s).sort((a,b)=>a.t-b.t);if(!V.modal)go()}));
  unsubs.push(onSnapshot(collection(db,'users',u.uid,'items'),s=>{S.items=rows(s).sort((a,b)=>b.t-a.t);if(!V.modal)go()}));
  go();
});
</script>
